{% extends "tma/base.html" %}
{% import "_icons.html" as ic %}

{% block content %}
<h1 class="font-display font-black text-xl mb-3 flex items-center gap-2 animate-in">
    {{ ic.icon('help', 'w-5 h-5 text-orange') }} Поддержка
</h1>

<section class="sticker p-5 animate-in">
    <p class="text-sm text-subtle">
        Опишите проблему или вопрос — сообщение уйдёт нашим операторам.
        Ответ придёт в личные сообщения от бота.
    </p>

    <label class="field-label mt-4" for="tmaSupportText">Ваше сообщение</label>
    <textarea id="tmaSupportText" class="input" rows="5" maxlength="2000"
              placeholder="Опишите, что случилось…"></textarea>

    <div id="tmaSupportResult" class="text-sm mt-2"></div>

    <button type="button" class="btn-pop w-full mt-3" id="tmaSupportSendBtn" onclick="tmaSendSupportMessage()">
        <span class="btn-text">Отправить</span>
    </button>
</section>
{% endblock %}
