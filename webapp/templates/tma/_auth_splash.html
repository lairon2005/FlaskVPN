<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FlaskVPN</title>
<meta name="theme-color" content="#F7F1E8">
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
<!-- Telegram WebApp JS SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="/static/css/styles.css" rel="stylesheet">
<link href="/static/css/tma.css" rel="stylesheet">
</head>
<body class="tma-body" style="padding-bottom:0;">
    <!-- Общий сплэш для ЛЮБОГО GET /tma/* без валидной cookie/сессии: пользователь мог
         открыть Mini App по прямому deeplink на конкретный экран, ни разу не пройдя
         /tma/auth (см. docs/tma-roadmap.md фаза 1.2). После успешной авторизации
         просто перезагружаем ту же страницу — роут отдаст уже настоящий экран. -->
    <div class="tma-splash">
        <div>
            <img src="/static/img/logo.svg" alt="FlaskVPN" class="tma-splash-logo" width="64" height="64">
            <h1 id="tmaSplashTitle" class="brand-wordmark" style="font-size:22px;margin:0 0 14px;">Flask<span class="vpn">VPN</span></h1>
            <div class="spinner" id="tmaSplashSpinner"></div>
            <div class="status text-gray" id="tmaSplashStatus" style="font-size:15px;margin-top:12px;">Авторизация…</div>
        </div>
    </div>

    <script src="/static/js/tma.js"></script>
</body>
</html>
